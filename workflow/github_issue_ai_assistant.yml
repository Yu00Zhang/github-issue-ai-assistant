    - data:
        code: "import json\nimport re\n\nCONTEXT_LIMIT = 18000\n\ndef _text(value,\
          \ limit):\n    if isinstance(value, str):\n        return value[:limit]\n\
          \    return \"\"\n\ndef _url(value, comment=False):\n    if not isinstance(value,\
          \ str):\n        return \"\"\n    pattern = (\n        r\"https://github\\\
          .com/[A-Za-z0-9_.-]+/\"\n        r\"[A-Za-z0-9_.-]+/issues/[1-9][0-9]*\"\
          \n    )\n    if comment:\n        pattern += r\"#issuecomment-[0-9]+\"\n\
          \    if re.fullmatch(pattern, value):\n        return value\n    return\
          \ \"\"\n\ndef _dump(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ separators=(\",\", \":\"))\n\n\ndef _failure(code, retryable=False, retry_after=None):\n\
          \    actions = {\n        \"INVALID_ISSUE_URL\": \"Use https://github.com/OWNER/REPO/issues/NUMBER.\"\
          ,\n        \"INVALID_MAX_COMMENTS\": \"Set max_comments to a whole number\
          \ from 0 to 30.\",\n        \"INVALID_CREDENTIALS\": \"Check the GitHub\
          \ credential in the Tool settings.\",\n        \"UNAUTHORIZED\": \"Check\
          \ the GitHub credential in the Tool settings.\",\n        \"FORBIDDEN\"\
          : \"Check repository access and token permissions.\",\n        \"NOT_FOUND\"\
          : \"Check the issue URL and access to the repository.\",\n        \"GONE\"\
          : \"The issue is no longer available. Check the repository on GitHub.\"\
          ,\n        \"RATE_LIMITED\": \"GitHub rate limited the request. Retry later.\"\
          ,\n        \"PULL_REQUEST_NOT_SUPPORTED\": \"Use an Issue URL; pull requests\
          \ are not supported.\",\n        \"REDIRECT_NOT_ALLOWED\": \"Open GitHub\
          \ and use the issue's current canonical URL.\",\n        \"TIMEOUT\": \"\
          GitHub did not respond in time. Retry later.\",\n        \"NETWORK_ERROR\"\
          : \"Check the plugin's network connection and retry later.\",\n        \"\
          GITHUB_UNAVAILABLE\": \"GitHub is temporarily unavailable. Retry later.\"\
          ,\n        \"VALIDATION_FAILED\": \"Check the issue URL and plugin input\
          \ values.\",\n        \"INVALID_RESPONSE\": \"The tool returned unexpected\
          \ data. Check the plugin logs.\",\n        \"TOOL_EXECUTION_FAILED\": \"\
          Check that the plugin is installed and its credential is selected.\",\n\
          \        \"INTERNAL_ERROR\": \"Check the plugin logs and retry later.\"\
          ,\n        \"UNEXPECTED_STATUS\": \"The GitHub request failed. Check the\
          \ plugin logs.\",\n    }\n    safe_code = code if isinstance(code, str)\
          \ and code in actions else \"INVALID_RESPONSE\"\n    message = (\n     \
          \   \"I could not retrieve this issue, so no AI analysis was generated.\\\
          n\\n\"\n        \"Error: \" + safe_code + \". \" + actions[safe_code]\n\
          \    )\n    if isinstance(retry_after, (int, float)) and not isinstance(retry_after,\
          \ bool):\n        if 0 <= retry_after <= 86400:\n            message +=\
          \ \" Retry after at least \" + str(int(retry_after)) + \" seconds.\"\n \
          \   elif retryable is True:\n        message += \" The request may succeed\
          \ on a later attempt.\"\n    return {\n        \"status\": \"error\",\n\
          \        \"context_json\": \"\",\n        \"error_message\": message,\n\
          \        \"source_url\": \"\",\n        \"scope_note\": \"No issue analysis\
          \ was generated.\",\n        \"focus\": \"\",\n    }\n\n\ndef main(tool_json,\
          \ focus=\"\") -> dict:\n    if not isinstance(tool_json, list) or len(tool_json)\
          \ != 1:\n        return _failure(\"INVALID_RESPONSE\")\n    payload = tool_json[0]\n\
          \    if not isinstance(payload, dict) or type(payload.get(\"ok\")) is not\
          \ bool:\n        return _failure(\"INVALID_RESPONSE\")\n    if payload[\"\
          ok\"] is False:\n        error = payload.get(\"error\")\n        if not\
          \ isinstance(error, dict):\n            return _failure(\"INVALID_RESPONSE\"\
          )\n        return _failure(error.get(\"code\"), error.get(\"retryable\"\
          ), error.get(\"retry_after_seconds\"))\n    if payload.get(\"error\") is\
          \ not None:\n        return _failure(\"INVALID_RESPONSE\")\n\n    issue\
          \ = payload.get(\"issue\")\n    comments = payload.get(\"comments\")\n \
          \   meta = payload.get(\"meta\")\n    if not isinstance(issue, dict) or\
          \ not isinstance(comments, list) or not isinstance(meta, dict):\n      \
          \  return _failure(\"INVALID_RESPONSE\")\n    source_url = _url(issue.get(\"\
          html_url\"))\n    if (\n        not source_url\n        or type(issue.get(\"\
          number\")) is not int\n        or issue[\"number\"] <= 0\n        or not\
          \ source_url.endswith(\"/\" + str(issue[\"number\"]))\n        or not isinstance(issue.get(\"\
          title\"), str)\n        or not isinstance(issue.get(\"labels\"), list)\n\
          \        or (issue.get(\"body\") is not None and not isinstance(issue.get(\"\
          body\"), str))\n        or type(issue.get(\"comments\")) is not int\n  \
          \      or issue[\"comments\"] < 0\n        or not all(isinstance(item, dict)\
          \ for item in comments)\n    ):\n        return _failure(\"INVALID_RESPONSE\"\
          )\n\n    body = _text(issue.get(\"body\"), 10000)\n    issue_body_shortened\
          \ = len(body) < len(issue.get(\"body\") or \"\")\n    labels = [_text(label,\
          \ 100) for label in issue[\"labels\"][:30] if isinstance(label, str)]\n\
          \    title = _text(issue[\"title\"], 512)\n    scope = {\n        \"comments_total\"\
          : issue[\"comments\"],\n        \"comments_received\": len(comments),\n\
          \        \"comments_in_prompt\": 0,\n        \"comments_order\": \"oldest_first\"\
          ,\n        \"upstream_comments_incomplete\": meta.get(\"comments_incomplete\"\
          ) is True,\n        \"upstream_issue_body_truncated\": meta.get(\"issue_body_truncated\"\
          ) is True,\n        \"upstream_comment_bodies_truncated\": bool(meta.get(\"\
          truncated_comment_ids\")),\n        \"upstream_warning_codes\": [\n    \
          \        item[:80] for item in (meta.get(\"warning_codes\") or [])[:10]\
          \ if isinstance(item, str)\n        ] if isinstance(meta.get(\"warning_codes\"\
          ), list) else [],\n        \"workflow_context_truncated\": issue_body_shortened\
          \ or title != issue[\"title\"] or labels != issue[\"labels\"],\n       \
          \ \"context_character_limit\": CONTEXT_LIMIT,\n    }\n    context = {\n\
          \        \"issue\": {\n            \"number\": issue[\"number\"],\n    \
          \        \"title\": title,\n            \"body\": body,\n            \"\
          state\": _text(issue.get(\"state\"), 30),\n            \"labels\": labels,\n\
          \            \"author\": _text(issue.get(\"author\"), 100),\n          \
          \  \"html_url\": source_url,\n            \"created_at\": _text(issue.get(\"\
          created_at\"), 40),\n            \"updated_at\": _text(issue.get(\"updated_at\"\
          ), 40),\n            \"comments\": issue[\"comments\"],\n        },\n  \
          \      \"comments\": [],\n        \"scope\": scope,\n    }\n    if len(_dump(context))\
          \ > CONTEXT_LIMIT - 1000:\n        low, high = 0, len(body)\n        while\
          \ low < high:\n            midpoint = (low + high + 1) // 2\n          \
          \  context[\"issue\"][\"body\"] = body[:midpoint]\n            if len(_dump(context))\
          \ <= CONTEXT_LIMIT - 1000:\n                low = midpoint\n           \
          \ else:\n                high = midpoint - 1\n        context[\"issue\"\
          ][\"body\"] = body[:low]\n        scope[\"workflow_context_truncated\"]\
          \ = True\n    for comment in comments[:30]:\n        comment_url = _url(comment.get(\"\
          html_url\"), comment=True)\n        if not comment_url or not comment_url.startswith(source_url\
          \ + \"#\"):\n            return _failure(\"INVALID_RESPONSE\")\n       \
          \ raw_body = comment.get(\"body\") or \"\"\n        if not isinstance(raw_body,\
          \ str):\n            return _failure(\"INVALID_RESPONSE\")\n        entry\
          \ = {\n            \"id\": comment.get(\"id\") if type(comment.get(\"id\"\
          )) is int else 0,\n            \"body\": \"\",\n            \"author\":\
          \ _text(comment.get(\"author\"), 100),\n            \"html_url\": comment_url,\n\
          \            \"created_at\": _text(comment.get(\"created_at\"), 40),\n \
          \           \"updated_at\": _text(comment.get(\"updated_at\"), 40),\n  \
          \          \"body_truncated\": False,\n        }\n        context[\"comments\"\
          ].append(entry)\n        scope[\"comments_in_prompt\"] = len(context[\"\
          comments\"])\n        if len(_dump(context)) > CONTEXT_LIMIT - 16:\n   \
          \         context[\"comments\"].pop()\n            scope[\"comments_in_prompt\"\
          ] = len(context[\"comments\"])\n            scope[\"workflow_context_truncated\"\
          ] = True\n            break\n        low, high = 0, min(len(raw_body), 2000)\n\
          \        while low < high:\n            midpoint = (low + high + 1) // 2\n\
          \            entry[\"body\"] = raw_body[:midpoint]\n            if len(_dump(context))\
          \ <= CONTEXT_LIMIT - 16:\n                low = midpoint\n            else:\n\
          \                high = midpoint - 1\n        entry[\"body\"] = raw_body[:low]\n\
          \        entry[\"body_truncated\"] = low < len(raw_body)\n        if entry[\"\
          body_truncated\"]:\n            scope[\"workflow_context_truncated\"] =\
          \ True\n    if len(context[\"comments\"]) < len(comments):\n        scope[\"\
          workflow_context_truncated\"] = True\n    result_json = _dump(context)\n\
          \    if len(result_json) > CONTEXT_LIMIT:\n        return _failure(\"INVALID_RESPONSE\"\
          )\n    incomplete = (\n        scope[\"upstream_comments_incomplete\"]\n\
          \        or scope[\"upstream_issue_body_truncated\"]\n        or scope[\"\
          upstream_comment_bodies_truncated\"]\n        or scope[\"workflow_context_truncated\"\
          ]\n        or len(context[\"comments\"]) < issue[\"comments\"]\n    )\n\
          \    scope_note = (\n        \"Analysis uses the issue and \" + str(len(context[\"\
          comments\"]))\n        + \" of \" + str(issue[\"comments\"]) + \" comments,\
          \ oldest first. \"\n        + (\"Some content is missing or truncated; conclusions\
          \ are provisional.\"\n           if incomplete else \"All reported comments\
          \ are included in the supplied context.\")\n    )\n    return {\n      \
          \  \"status\": \"success\",\n        \"context_json\": result_json,\n  \
          \      \"error_message\": \"\",\n        \"source_url\": source_url,\n \
          \       \"scope_note\": scope_note,\n        \"focus\": _text(focus, 1000),\n\
          \    }\n"
